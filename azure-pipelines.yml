# ============================================================
# ClipWave - Azure DevOps CI/CD Pipeline
# ============================================================
# IMPORTANT:
# 1. Create an Azure DevOps ARM service connection named:
#       clipwave-azure
# 2. Make sure that service connection can create/update resources
#    in the target Azure subscription.
# 3. The backend still needs PostgreSQL, Redis and object storage
#    configuration for full application functionality. This pipeline
#    deploys the frontend and backend containers.
# ============================================================

trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Azure DevOps service connection - CREATE THIS IN AZURE DEVOPS
  azureServiceConnection: 'clipwave-azure'

  # Azure resources for Student 2 / ClipWave
  resourceGroup: 'rg-clipwave'
  containerRegistry: 'clipwaveregistry2026'
  containerAppEnvironment: 'clipwave-env'

  backendApp: 'clipwave-api'
  frontendApp: 'clipwave-web'

  # Keep the region that was used by the previous deployment.
  location: 'spaincentral'

  # Docker image names
  backendImageName: 'clipwave-backend'
  frontendImageName: 'clipwave-frontend'

steps:

# ============================================================
# 1. CHECKOUT SOURCE CODE
# ============================================================

- checkout: self
  displayName: 'Checkout ClipWave source code'


# ============================================================
# 2. CHECK AZURE CLI / CONTAINER APPS EXTENSION
# ============================================================

- task: AzureCLI@2
  displayName: 'Prepare Azure CLI'
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      set -e

      echo "Azure account:"
      az account show --query "{name:name,id:id,tenantId:tenantId}" -o table

      echo "Azure CLI version:"
      az version --output table

      # The Container Apps command group is supplied by the
      # containerapp CLI extension. Install/update it on the hosted agent.
      az extension add --name containerapp --upgrade --yes

      echo "Container Apps extension ready."


# ============================================================
# 3. CREATE RESOURCE GROUP IF IT DOES NOT EXIST
# ============================================================

- task: AzureCLI@2
  displayName: 'Create ClipWave Resource Group'
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      set -e

      if az group show \
        --name "$(resourceGroup)" \
        >/dev/null 2>&1
      then
        echo "Resource group already exists: $(resourceGroup)"
      else
        echo "Creating resource group: $(resourceGroup)"

        az group create \
          --name "$(resourceGroup)" \
          --location "$(location)"

        echo "Resource group created."
      fi


# ============================================================
# 4. CREATE AZURE CONTAINER REGISTRY IF MISSING
# ============================================================

- task: AzureCLI@2
  displayName: 'Create ClipWave Container Registry'
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      set -e

      if az acr show \
        --name "$(containerRegistry)" \
        --resource-group "$(resourceGroup)" \
        >/dev/null 2>&1
      then
        echo "Container Registry already exists: $(containerRegistry)"
      else
        echo "Creating Container Registry: $(containerRegistry)"

        az acr create \
          --name "$(containerRegistry)" \
          --resource-group "$(resourceGroup)" \
          --location "$(location)" \
          --sku Basic \
          --admin-enabled true

        echo "Container Registry created."
      fi

      # Ensure admin credentials are available to Container Apps.
      az acr update \
        --name "$(containerRegistry)" \
        --admin-enabled true

      echo "ACR ready: $(containerRegistry).azurecr.io"


# ============================================================
# 5. BUILD AND PUSH BACKEND DOCKER IMAGE
# ============================================================

- task: AzureCLI@2
  displayName: 'Build and Push ClipWave Backend Image'
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      set -e

      TAG="$(Build.BuildId)"
      ACR_NAME="$(containerRegistry)"
      IMAGE_NAME="$(backendImageName)"
      FULL_IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${TAG}"

      echo "=============================================="
      echo "Building ClipWave Backend"
      echo "=============================================="
      echo "Image: ${FULL_IMAGE}"

      az acr login --name "${ACR_NAME}"

      # backend is the Docker build context.
      docker build \
        --tag "${FULL_IMAGE}" \
        --file backend/Dockerfile \
        ./backend

      docker push "${FULL_IMAGE}"

      echo "Backend image pushed successfully."


# ============================================================
# 6. BUILD AND PUSH FRONTEND DOCKER IMAGE
# ============================================================

- task: AzureCLI@2
  displayName: 'Build and Push ClipWave Frontend Image'
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      set -e

      TAG="$(Build.BuildId)"
      ACR_NAME="$(containerRegistry)"
      IMAGE_NAME="$(frontendImageName)"
      FULL_IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${TAG}"

      echo "=============================================="
      echo "Building ClipWave Frontend"
      echo "=============================================="
      echo "Image: ${FULL_IMAGE}"

      az acr login --name "${ACR_NAME}"

      docker build \
        --tag "${FULL_IMAGE}" \
        --file frontend/Dockerfile \
        ./frontend

      docker push "${FULL_IMAGE}"

      echo "Frontend image pushed successfully."


# ============================================================
# 7. CREATE CONTAINER APPS ENVIRONMENT IF MISSING
# ============================================================

- task: AzureCLI@2
  displayName: 'Create ClipWave Container Apps Environment'
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      set -e

      if az containerapp env show \
        --name "$(containerAppEnvironment)" \
        --resource-group "$(resourceGroup)" \
        >/dev/null 2>&1
      then
        echo "Container Apps environment already exists."
      else
        echo "Creating Container Apps environment..."

        az containerapp env create \
          --name "$(containerAppEnvironment)" \
          --resource-group "$(resourceGroup)" \
          --location "$(location)"

        echo "Container Apps environment created."
      fi


# ============================================================
# 8. DEPLOY / UPDATE BACKEND CONTAINER APP
# ============================================================
# IMPORTANT: The local ClipWave backend is exposed on port 4000.
# The old StreamHive YAML used 5000, which would prevent traffic
# from reaching the backend if the container listens on 4000.
# ============================================================

- task: AzureCLI@2
  displayName: 'Deploy ClipWave Backend'
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      set -e

      TAG="$(Build.BuildId)"
      RESOURCE_GROUP="$(resourceGroup)"
      APP_NAME="$(backendApp)"
      ENVIRONMENT="$(containerAppEnvironment)"
      ACR_NAME="$(containerRegistry)"
      IMAGE="${ACR_NAME}.azurecr.io/$(backendImageName):${TAG}"

      echo "=============================================="
      echo "Deploying ClipWave Backend"
      echo "=============================================="
      echo "App: ${APP_NAME}"
      echo "Image: ${IMAGE}"
      echo "Target port: 4000"

      ACR_USERNAME="$(az acr credential show \
        --name "${ACR_NAME}" \
        --query username \
        --output tsv)"

      ACR_PASSWORD="$(az acr credential show \
        --name "${ACR_NAME}" \
        --query 'passwords[0].value' \
        --output tsv)"

      if [ -z "${ACR_USERNAME}" ] || [ -z "${ACR_PASSWORD}" ]; then
        echo "ERROR: Unable to retrieve ACR credentials."
        exit 1
      fi

      if az containerapp show \
        --name "${APP_NAME}" \
        --resource-group "${RESOURCE_GROUP}" \
        >/dev/null 2>&1
      then
        echo "Backend Container App exists. Updating image..."

        az containerapp update \
          --name "${APP_NAME}" \
          --resource-group "${RESOURCE_GROUP}" \
          --image "${IMAGE}" \
          --revision-suffix "build-${TAG}"

      else
        echo "Backend Container App does not exist. Creating..."

        az containerapp create \
          --name "${APP_NAME}" \
          --resource-group "${RESOURCE_GROUP}" \
          --environment "${ENVIRONMENT}" \
          --image "${IMAGE}" \
          --target-port 4000 \
          --ingress external \
          --registry-server "${ACR_NAME}.azurecr.io" \
          --registry-username "${ACR_USERNAME}" \
          --registry-password "${ACR_PASSWORD}" \
          --min-replicas 1 \
          --max-replicas 2 \
          --cpu 0.5 \
          --memory 1Gi
      fi

      # Ensure the registry configuration is present after an update.
      az containerapp registry set \
        --name "${APP_NAME}" \
        --resource-group "${RESOURCE_GROUP}" \
        --server "${ACR_NAME}.azurecr.io" \
        --username "${ACR_USERNAME}" \
        --password "${ACR_PASSWORD}"

      BACKEND_FQDN="$(az containerapp show \
        --name "${APP_NAME}" \
        --resource-group "${RESOURCE_GROUP}" \
        --query 'properties.configuration.ingress.fqdn' \
        --output tsv)"

      if [ -z "${BACKEND_FQDN}" ]; then
        echo "ERROR: Backend FQDN could not be retrieved."
        exit 1
      fi

      echo "Backend URL: https://${BACKEND_FQDN}"


# ============================================================
# 9. DEPLOY / UPDATE FRONTEND CONTAINER APP
# ============================================================
# The frontend Nginx configuration in the current project uses
# BACKEND_URL at runtime. Therefore the frontend must receive the
# actual Azure backend URL after the backend is deployed.
# ============================================================

- task: AzureCLI@2
  displayName: 'Deploy ClipWave Frontend'
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      set -e

      TAG="$(Build.BuildId)"
      RESOURCE_GROUP="$(resourceGroup)"
      APP_NAME="$(frontendApp)"
      ENVIRONMENT="$(containerAppEnvironment)"
      ACR_NAME="$(containerRegistry)"
      IMAGE="${ACR_NAME}.azurecr.io/$(frontendImageName):${TAG}"

      echo "=============================================="
      echo "Deploying ClipWave Frontend"
      echo "=============================================="

      BACKEND_FQDN="$(az containerapp show \
        --name "$(backendApp)" \
        --resource-group "${RESOURCE_GROUP}" \
        --query 'properties.configuration.ingress.fqdn' \
        --output tsv)"

      if [ -z "${BACKEND_FQDN}" ]; then
        echo "ERROR: Backend FQDN could not be retrieved."
        exit 1
      fi

      BACKEND_URL="https://${BACKEND_FQDN}"

      echo "Frontend image: ${IMAGE}"
      echo "Backend URL: ${BACKEND_URL}"

      ACR_USERNAME="$(az acr credential show \
        --name "${ACR_NAME}" \
        --query username \
        --output tsv)"

      ACR_PASSWORD="$(az acr credential show \
        --name "${ACR_NAME}" \
        --query 'passwords[0].value' \
        --output tsv)"

      if [ -z "${ACR_USERNAME}" ] || [ -z "${ACR_PASSWORD}" ]; then
        echo "ERROR: Unable to retrieve ACR credentials."
        exit 1
      fi

      if az containerapp show \
        --name "${APP_NAME}" \
        --resource-group "${RESOURCE_GROUP}" \
        >/dev/null 2>&1
      then
        echo "Frontend Container App exists. Updating..."

        az containerapp update \
          --name "${APP_NAME}" \
          --resource-group "${RESOURCE_GROUP}" \
          --image "${IMAGE}" \
          --revision-suffix "build-${TAG}" \
          --set-env-vars "BACKEND_URL=${BACKEND_URL}"

      else
        echo "Frontend Container App does not exist. Creating..."

        az containerapp create \
          --name "${APP_NAME}" \
          --resource-group "${RESOURCE_GROUP}" \
          --environment "${ENVIRONMENT}" \
          --image "${IMAGE}" \
          --target-port 80 \
          --ingress external \
          --registry-server "${ACR_NAME}.azurecr.io" \
          --registry-username "${ACR_USERNAME}" \
          --registry-password "${ACR_PASSWORD}" \
          --env-vars "BACKEND_URL=${BACKEND_URL}" \
          --min-replicas 1 \
          --max-replicas 2 \
          --cpu 0.25 \
          --memory 0.5Gi
      fi

      az containerapp registry set \
        --name "${APP_NAME}" \
        --resource-group "${RESOURCE_GROUP}" \
        --server "${ACR_NAME}.azurecr.io" \
        --username "${ACR_USERNAME}" \
        --password "${ACR_PASSWORD}"

      echo "Frontend deployment completed."


# ============================================================
# 10. DISPLAY DEPLOYMENT URLS
# ============================================================

- task: AzureCLI@2
  displayName: 'Show ClipWave Application URLs'
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      set -e

      BACKEND_FQDN="$(az containerapp show \
        --name "$(backendApp)" \
        --resource-group "$(resourceGroup)" \
        --query 'properties.configuration.ingress.fqdn' \
        --output tsv)"

      FRONTEND_FQDN="$(az containerapp show \
        --name "$(frontendApp)" \
        --resource-group "$(resourceGroup)" \
        --query 'properties.configuration.ingress.fqdn' \
        --output tsv)"

      echo ""
      echo "============================================================"
      echo "CLIPWAVE DEPLOYMENT COMPLETED"
      echo "============================================================"
      echo ""
      echo "Frontend:"
      echo "https://${FRONTEND_FQDN}"
      echo ""
      echo "Backend:"
      echo "https://${BACKEND_FQDN}"
      echo ""
      echo "============================================================"
