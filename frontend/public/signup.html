<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Create account — ClipWave</title><link rel="stylesheet" href="css/style.css?v=5"></head>
<body>
<div class="topbar"><a href="index.html" class="brand"><span class="hex"></span>ClipWave</a><div id="nav-actions" class="nav-links"></div></div>
<div class="content-shell" style="max-width:1180px;">
  <aside class="sidebar">
    <div class="sidebar-label">Navigation</div>
    <a href="index.html"><span class="side-bullet"></span>Home</a>
    <a href="index.html"><span class="side-bullet"></span>Latest videos</a>
    <a href="index.html"><span class="side-bullet"></span>Discover</a>
    <div id="sidebar-auth"></div>
  </aside>
  <main style="min-width:0;">
<div class="auth-shell">
  <div class="eyebrow">Join the community</div><h1>Create your account.</h1>
  <div class="sub">Set up a consumer profile to discover videos, leave ratings and take part in discussions.</div>
  <div id="msg"></div>
  <form id="signup-form">
    <div class="field"><label for="display_name">Display name</label><input type="text" id="display_name" placeholder="How should we call you?" required></div>
    <div class="field"><label for="email">Email address</label><input type="email" id="email" placeholder="you@example.com" required></div>
    <div class="field"><label for="password">Password</label><input type="password" id="password" minlength="6" placeholder="At least 6 characters" required></div>
    <button class="btn-block" type="submit">Create my account</button>
  </form>
  <div class="switch-link">Already a member? <a href="login.html">Sign in instead</a></div>
</div>
<script src="js/api.js?v=5"></script></div></main></div>
<script src="js/auth.js?v=3"></script>
<script>if (typeof renderSidebarAuth === 'function') renderSidebarAuth();</script>
</body></html>
